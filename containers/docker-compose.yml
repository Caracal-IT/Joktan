    ports:
      - "${MQTT_PORT2:-1783}:1883"
      - "${MQTT_TLS_PORT2:-8783}:8883"
      - "${MQTT_MTLS_PORT2:-8784}:8884"
    environment:
      # Leave both empty to allow anonymous connections.
      MQTT_USERNAME: ${MQTT_USERNAME:-}
