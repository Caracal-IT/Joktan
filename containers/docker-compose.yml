              -keyout ca.key -out client/ca.crt 2>/dev/null
            openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr 2>/dev/null
            printf 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:::1\nextendedKeyUsage=serverAuth\n' > server.ext
            openssl x509 -req -in server.csr -CA client/ca.crt -CAkey ca.key -CAserial ca.srl -CAcreateserial -days 825 \
              -extfile server.ext -out server.crt 2>/dev/null
            openssl req -newkey rsa:2048 -nodes -subj "/CN=joktan" -keyout client/client.key -out client.csr 2>/dev/null
            printf 'extendedKeyUsage=clientAuth\n' > client.ext
            openssl x509 -req -in client.csr -CA client/ca.crt -CAkey ca.key -CAserial ca.srl -CAcreateserial -days 825 \
              -extfile client.ext -out client/client.crt 2>/dev/null
            openssl pkcs12 -export -in client/client.crt -inkey client/client.key -passout pass:joktan \
              -out client/client.p12
