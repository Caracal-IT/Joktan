            cd /
          else
            echo "Could not install openssl, so TLS is off. Check the network and restart the container."
          fi
        fi
      
        # Certificates copied in with docker cp or podman cp belong to whoever copied them.
        chown -R mosquitto:mosquitto /certs
      
        if [ -z "$$tls" ] && [ -f /certs/client/client.p12 ]; then
          tls='cafile /certs/client/ca.crt\ncertfile /certs/server.crt\nkeyfile /certs/server.key\n'
        fi
      
        if [ -n "$$tls" ]; then
