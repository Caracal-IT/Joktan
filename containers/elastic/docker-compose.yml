# Elasticsearch and Kibana for local development. Works with Docker and Podman:
#
#   docker compose -f containers/elastic/docker-compose.yml up -d
#   podman compose -f containers/elastic/docker-compose.yml up -d
#
# See containers/elastic/README.md.

name: joktan-elastic

services:
  elasticsearch:
    # Fully qualified, because Podman does not assume Docker Hub for short names.
    image: docker.io/library/elasticsearch:9.5.5
    container_name: joktan-elasticsearch
    restart: unless-stopped
    ports:
      # Only on this machine, because security is off.
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms${ELASTICSEARCH_HEAP:-1g} -Xmx${ELASTICSEARCH_HEAP:-1g}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.io/library/kibana:9.5.5
    container_name: joktan-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  elasticsearch-data:
