# Prometheus and Grafana for local development. Works with Docker and Podman:
#
#   docker compose -f profile/ettiene/containers/monitoring/docker-compose.yml up -d
#   podman compose -f profile/ettiene/containers/monitoring/docker-compose.yml up -d
#
# See profile/ettiene/containers/monitoring/README.md.
#
# Each image is built with its configuration copied in, rebuilt on every "up" so changes are picked
# up; the build is cached, so it is quick. Copied rather than mounted, because Podman on macOS only
# shares some folders with its VM.

name: joktan-monitoring

services:
  prometheus:
    build: prometheus
    pull_policy: build
    image: localhost/joktan-prometheus:latest
    container_name: joktan-prometheus
    restart: unless-stopped
    ports:
      # Only on this machine, because Prometheus has no login.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    build: grafana
    pull_policy: build
    image: localhost/joktan-grafana:latest
    container_name: joktan-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  prometheus-data:
  grafana-data:
