# Local test broker. Any username and password are accepted.
allow_anonymous true
log_dest stdout

# Plain MQTT
listener 1883

# TLS
listener 8883
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/cert.pem
keyfile /mosquitto/certs/key.pem

# Mutual TLS: clients need a certificate signed by the CA
listener 8884
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/cert.pem
keyfile /mosquitto/certs/key.pem
require_certificate true
