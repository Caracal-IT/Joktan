# Elasticsearch and Kibana for local development. Works with Docker and Podman:
#
#   docker compose -f profile/ettiene/containers/elastic/docker-compose.yml up -d
#   podman compose -f profile/ettiene/containers/elastic/docker-compose.yml up -d
#
# See profile/ettiene/containers/elastic/README.md.

name: joktan-elastic

services:
  elasticsearch:
    # Fully qualified, because Podman does not assume Docker Hub for short names.
    image: docker.io/library/elasticsearch:9.5.5
    container_name: joktan-elasticsearch
    restart: unless-stopped
    ports:
      # Only on this machine, because security is off.
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms${ELASTICSEARCH_HEAP:-1g} -Xmx${ELASTICSEARCH_HEAP:-1g}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - default
      - telemetry
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.io/library/kibana:9.5.5
    container_name: joktan-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Makes the data view that shows Joktan's logs in Kibana, then waits, so that it does not look
  # like something that stopped.
  kibana-setup:
    image: docker.io/library/kibana:9.5.5
    container_name: joktan-kibana-setup
    restart: unless-stopped
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -fs -X POST http://kibana:5601/api/data_views/data_view \
          -H 'kbn-xsrf: joktan' -H 'Content-Type: application/json' \
          -d '{"override":true,"data_view":{"id":"joktan-logs","name":"Joktan logs","title":"logs-joktan*","timeFieldName":"@timestamp","allowNoIndex":true}}' >/dev/null; do
          sleep 5
        done
        echo "Made the Joktan logs data view"
        exec sleep infinity

networks:
  # Shared with containers/monitoring, whose collector sends Joktan's logs here.
  telemetry:
    name: joktan-telemetry

volumes:
  elasticsearch-data:
