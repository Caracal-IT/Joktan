# Builds Joktan for Windows and macOS and uploads each build as an artifact.
# Windows builds are zipped publish folders; macOS builds are zipped, unsigned .app bundles.
# Pushing a tag such as v1.2.0 also publishes a GitHub Release with the builds attached.

name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # A tag v1.2.0 gives version 1.2.0; any other build gives 0.0.<run number>.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.{0}', github.run_number) }}

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [ win-x64, win-arm64 ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: >
          dotnet publish Joktan.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${VERSION#v}
          -o publish/${{ matrix.rid }}

      - name: Zip
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath Joktan-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Joktan-${{ matrix.rid }}
          path: Joktan-${{ matrix.rid }}.zip

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish Joktan.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:Version=${VERSION#v}
          -o publish/${{ matrix.rid }}

      - name: Make the .app bundle
        run: |
          app="bundle/Joktan.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/${{ matrix.rid }}/. "$app/Contents/MacOS/"
          cp packaging/macos/Joktan.icns "$app/Contents/Resources/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Joktan</string>
            <key>CFBundleDisplayName</key><string>Joktan</string>
            <key>CFBundleIdentifier</key><string>io.github.nagloopers.joktan</string>
            <key>CFBundleExecutable</key><string>Joktan</string>
            <key>CFBundleIconFile</key><string>Joktan.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          chmod +x "$app/Contents/MacOS/Joktan"
          # Ad-hoc signature so Apple Silicon will run it; it is not notarised.
          codesign --force --deep --sign - "$app"
          # ditto keeps the bundle's permissions and signature inside the zip.
          ditto -c -k --keepParent "$app" Joktan-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Joktan-${{ matrix.rid }}
          path: Joktan-${{ matrix.rid }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Joktan $VERSION" --generate-notes
