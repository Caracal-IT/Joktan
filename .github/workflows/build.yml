# Builds and tests Joktan, reports code coverage, and packages it for Windows and macOS.
# Windows builds are zipped publish folders; macOS builds are zipped, unsigned .app bundles.
# It only runs when started by hand, from the Actions tab or with `gh workflow run build.yml`.
# Giving a version such as 1.2.0 also tags the commit and publishes a GitHub Release with the builds.

name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.0. Leave empty to build and test without releasing.
        required: false
        type: string

permissions:
  contents: read

env:
  # A version of 1.2.0 gives v1.2.0; a run without one gives v0.0.<run number>.
  VERSION: ${{ inputs.version != '' && format('v{0}', inputs.version) || format('v0.0.{0}', github.run_number) }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    steps:
      - name: Check the version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version such as 1.2.0."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Joktan.slnx -c Release

      - name: Test with coverage
        run: dotnet test --solution Joktan.slnx -c Release --no-build --coverage --coverage-output-format cobertura --results-directory TestResults

      - name: Report coverage
        shell: bash
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"TestResults/*.cobertura.xml" -targetdir:TestResults/report -reporttypes:"Html;MarkdownSummaryGithub" -assemblyfilters:"+Joktan*;-*.Tests" -filefilters:"-*.g.cs"
          cat TestResults/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/report

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [ win-x64, win-arm64 ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Joktan/Joktan.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${VERSION#v}
          -o publish/${{ matrix.rid }}

      - name: Zip
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath Joktan-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Joktan-${{ matrix.rid }}
          path: Joktan-${{ matrix.rid }}.zip

  macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Joktan/Joktan.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:Version=${VERSION#v}
          -o publish/${{ matrix.rid }}

      - name: Make the .app bundle
        run: |
          app="bundle/Joktan.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/${{ matrix.rid }}/. "$app/Contents/MacOS/"
          cp packaging/macos/Joktan.icns "$app/Contents/Resources/"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Joktan</string>
            <key>CFBundleDisplayName</key><string>Joktan</string>
            <key>CFBundleIdentifier</key><string>io.github.nagloopers.joktan</string>
            <key>CFBundleExecutable</key><string>Joktan</string>
            <key>CFBundleIconFile</key><string>Joktan.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          chmod +x "$app/Contents/MacOS/Joktan"
          # Ad-hoc signature so Apple Silicon will run it; it is not notarised.
          codesign --force --deep --sign - "$app"
          # ditto keeps the bundle's permissions and signature inside the zip.
          ditto -c -k --keepParent "$app" Joktan-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Joktan-${{ matrix.rid }}
          path: Joktan-${{ matrix.rid }}.zip

  release:
    if: inputs.version != ''
    needs: [ windows, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Joktan-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Joktan $VERSION" --generate-notes
