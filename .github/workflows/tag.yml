# Tags every commit that reaches main with its version: the major and minor numbers from
# Directory.Build.props, then the next patch number for them. Version 3.0 gives v3.0.0 first, then v3.0.1,
# and changing it to 3.1 starts again at v3.1.0. A commit that already has a tag for that version, such as one
# tagged by hand before it was merged, keeps it.
# The Build workflow stamps the app with this version, which the app shows in its About window.

name: Tag

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

# Two pushes close together would otherwise both take the same number.
concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag the commit
        run: |
          base=$(sed -nE 's|.*<Version>([0-9]+\.[0-9]+)\..*</Version>.*|\1|p' Directory.Build.props)
          if [ -z "$base" ]; then
            echo "::error::Directory.Build.props has no version."
            exit 1
          fi
          git fetch --tags --force origin
          existing=$(git tag --points-at HEAD | grep -E "^v$base\.[0-9]+$" | sort -V | tail -1)
          if [ -n "$existing" ]; then
            echo "Already tagged $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          last=$(git tag --list "v$base.*" | grep -E "^v$base\.[0-9]+$" | sed 's/.*\.//' | sort -n | tail -1)
          tag="v$base.$(( ${last:--1} + 1 ))"
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged $tag" >> "$GITHUB_STEP_SUMMARY"
